<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wortarten-Liga</title>
<style>
:root{--bg1:#120f24;--bg2:#251d52;--ink:#1a1d24;--muted:#5c6475;--cyan:#39d5ff;--gold:#ffd23f;--gold2:#e0a800}
*{box-sizing:border-box}
html{background:#120f24}
html,body{margin:0}
body{min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 85% -10%,rgba(57,213,255,.22),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(194,24,91,.25),transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
button{font:inherit;cursor:pointer;border:0}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 40px}
header.top{display:flex;align-items:center;gap:12px;color:#fff;margin-bottom:16px;flex-wrap:wrap}
header.top h1{font-size:clamp(22px,3.6vw,30px);margin:0;letter-spacing:1px;font-weight:900;text-transform:uppercase}
header.top h1 span{color:var(--cyan)}
header.top .rank{margin-left:auto;background:rgba(255,255,255,.08);border:1px solid rgba(57,213,255,.4);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
header.top .rank b{color:var(--gold)}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-bottom:18px;align-items:stretch}
.hero h2{margin:0 0 8px;font-size:clamp(22px,3.4vw,30px)}
.hero p{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
.tagrow{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
input.name{font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:2px solid #cfd5df;width:min(260px,100%)}
.trophies{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:14px;color:#fff;display:flex;flex-direction:column;justify-content:center}
.trophies h3{margin:0 0 10px;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--cyan)}
.tro{display:flex;gap:10px;justify-content:space-around;flex-wrap:wrap}
.tro div{width:74px;text-align:center;font-size:12px;opacity:.35;filter:grayscale(1);transition:.3s}
.tro div.on{opacity:1;filter:none}
.tro svg{width:52px;height:52px;display:block;margin:0 auto 4px}
.bracket{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.mode{background:#fff;border-radius:16px;padding:16px;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .15s;position:relative;overflow:hidden;color:var(--ink)}
.mode:hover{transform:translateY(-3px)}
.mode .lv{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.mode h3{margin:4px 0 6px;font-size:19px}
.mode p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.mode .dots{display:flex;gap:5px;margin-top:10px}
.mode .dots i{width:14px;height:14px;border-radius:4px;display:block}
.mode .step{position:absolute;right:12px;top:10px;font-size:34px;font-weight:900;color:#eef0f5}
.row2{display:grid;grid-template-columns:1fr 2fr;gap:14px}
.mode.speed{background:linear-gradient(135deg,#0b6a8a,#39d5ff);color:#fff}
.mode.speed p,.mode.speed .lv{color:#e6fbff}
.mode.final{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#3a2600,#8a5a00);color:#fff}
.mode.final p{color:#ffeab0}.mode.final .lv{color:var(--gold)}
.btn{background:var(--gold);color:#2a1f0a;font-weight:800;padding:12px 18px;border-radius:12px;font-size:16px;box-shadow:0 3px 0 #b89100}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b89100}
.btn.ghost{background:#eef1f6;color:var(--ink);box-shadow:0 3px 0 #c9cfda}
.btn.dark{background:#251d52;color:#fff;box-shadow:0 3px 0 #0c0920}
.btn.small{padding:8px 12px;font-size:14px}
.topbar{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:12px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.1);border-radius:999px;padding:6px 12px;font-size:14px}
.pill b{color:var(--gold)}
.pill.combo{background:#c2185b;font-weight:800;transition:transform .15s}
.pill.combo.pop{transform:scale(1.18)}
.progress{flex:1;min-width:120px;height:10px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#c2185b);width:0;transition:width .4s}
.case-h{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.case-h .no{background:#251d52;color:#fff;font-weight:800;border-radius:10px;padding:4px 10px;font-size:14px}
.case-h h2{margin:0;font-size:20px}
.task{font-size:clamp(18px,2.6vw,22px);font-weight:800;margin:14px 0 4px}
.task .cnt{display:inline-block;margin-left:6px;padding:2px 10px;border-radius:99px;color:#fff;font-size:16px;vertical-align:2px}
.task small{display:block;font-weight:500;color:var(--muted);font-size:15px;margin-top:4px}
.sentence{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 8px;align-items:flex-start}
.w{display:flex;flex-direction:column;align-items:center;gap:4px}
.w button{font-size:clamp(18px,2.8vw,24px);font-weight:700;padding:10px 13px;border-radius:12px;background:#fff;border:2.5px solid #c8cfdb;color:var(--ink);box-shadow:0 3px 0 #c8cfdb;transition:.15s;min-height:52px}
.w button:hover:not(:disabled){border-color:#251d52;transform:translateY(-2px)}
.w button:disabled{cursor:default}
.w .lab{font-size:12px;font-weight:800;min-height:15px;text-align:center;line-height:1.15}
.w.focus button{outline:4px solid var(--cyan);outline-offset:3px;animation:pulse 1.1s infinite}
@keyframes pulse{50%{outline-color:#b8f0ff}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.feedback{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:16px;line-height:1.45;display:none}
.feedback.show{display:block}
.feedback.ok{background:#e3f4e8;color:#185c2c;border:1.5px solid #9dd3ad}
.feedback.bad{background:#fde8e8;color:#7d1414;border:1.5px solid #f2a7a7}
.feedback.info{background:#e6f8ff;color:#0b4a60;border:1.5px solid #9fdcf0}
.caster{font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;opacity:.7;display:block;margin-bottom:2px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.legend span{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;color:#fff}
.center{text-align:center}
.stars{font-size:40px;letter-spacing:6px;color:var(--gold2)}
.stars .off{color:#d9dde5}
.big-num{font-size:56px;font-weight:900;margin:6px 0}
.timer{font-size:34px;font-weight:900;color:#fff;min-width:70px;text-align:center}
.timer.low{color:#ff7a9a}
.blitz-sent{font-size:clamp(20px,3vw,28px);line-height:1.6;margin:10px 0 6px}
.blitz-sent mark{background:#d8f6ff;border-bottom:4px solid var(--cyan);padding:0 4px;border-radius:4px;font-weight:800}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.qgrid button{padding:18px 10px;border-radius:14px;font-size:clamp(17px,2.4vw,21px);font-weight:800;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.qgrid button.right{outline:5px solid #39d5ff;outline-offset:2px}
.qgrid button.wrong{opacity:.3}
.sheet{position:fixed;inset:0;background:rgba(10,8,25,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.show{display:flex}
.sheet .panel{background:#fff;width:100%;max-width:760px;border-radius:20px 20px 0 0;padding:16px 16px 22px}
.sheet .panel h3{margin:0 0 10px}
.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.palette button{padding:14px 6px;border-radius:12px;font-weight:800;color:#fff;font-size:15px}
.modal{position:fixed;inset:0;background:rgba(10,8,25,.65);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal.show{display:flex}
.modal .card{max-width:760px;width:100%;max-height:90vh;overflow:auto}
table.cheat{width:100%;border-collapse:collapse;font-size:15px}
table.cheat td,table.cheat th{border-bottom:1px solid #e3e6ec;padding:7px 6px;text-align:left;vertical-align:top}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.stats{text-align:left;max-width:560px;margin:14px auto 0;background:#f5f3ff;border:1.5px solid #d9d2ff;border-radius:14px;padding:14px 16px}
.stats h3{margin:0 0 6px;font-size:17px}
.stats ul{margin:6px 0 0;padding-left:20px}
.stats li{margin:3px 0;font-size:15px}
.stats .tip{margin-top:8px;font-size:14px;color:#3b2f80}
.cert{border:6px double #b89100;border-radius:14px;padding:24px 20px;background:linear-gradient(135deg,#fffdf3,#fff2c4);text-align:center}
.cert h2{font-size:28px;margin:6px 0;letter-spacing:1px}
.cert .nm{font-size:30px;font-weight:900;color:#251d52;border-bottom:2px solid #b89100;display:inline-block;padding:0 20px 4px;margin:10px 0}
footer{color:rgba(255,255,255,.55);font-size:12px;text-align:center;margin-top:22px}
@media (max-width:760px){.hero,.bracket,.row2{grid-template-columns:1fr}.mode.final{flex-direction:column;align-items:flex-start}.palette{grid-template-columns:repeat(2,1fr)}header.top .rank{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <svg width="46" height="46" viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="13" width="40" height="24" rx="12" fill="#39d5ff"/><rect x="11" y="23" width="10" height="3" rx="1.5" fill="#120f24"/><rect x="14.5" y="19.5" width="3" height="10" rx="1.5" fill="#120f24"/><circle cx="32" cy="22" r="2.6" fill="#ffd23f"/><circle cx="37" cy="27" r="2.6" fill="#c2185b"/></svg>
    <h1>Wortarten-<span>Liga</span></h1>
    <div class="rank">Rang: <b id="rankName">Rookie</b> · <span id="totalXp">0</span> XP</div>
  </header>
  <main id="app"></main>
  <footer>Deutsch Klasse 8 · Wortarten üben · Es werden keine Daten gespeichert oder gesendet.</footer>
</div>

<div class="sheet" id="sheet"><div class="panel"><h3 id="sheetTitle">Welche Wortart?</h3><div class="palette" id="palette"></div>
<div class="actions"><button class="btn ghost small" id="sheetClose">Abbrechen</button></div></div></div>

<div class="modal" id="cheat"><div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0">Spickzettel: Wortarten</h2><button class="btn ghost small" id="cheatClose">Schließen</button></div>
  <table class="cheat" style="margin-top:10px" id="cheatTable"></table>
</div></div>

<script>
"use strict";
/* ---------- Wortarten ---------- */
const WA = {
 N:{n:"Nomen",pl:"Nomen",c:"#1f5fbf",l:"#e3ecfa",h:"<b>Artikelprobe:</b> Kannst du <i>der, die</i> oder <i>das</i> davorsetzen? Nomen schreibt man groß.",ex:"der Hund, das Handy, das Zocken"},
 V:{n:"Verb",pl:"Verben",c:"#d62828",l:"#fde8e8",h:"<b>Verben</b> sagen, was jemand tut oder was passiert. Probe: Kannst du es beugen? <i>ich spiele, du spielst …</i>",ex:"spielt, ist, hat, kommst"},
 J:{n:"Adjektiv",pl:"Adjektive",c:"#2e9b45",l:"#e2f4e6",h:"<b>Nomen-Probe:</b> Passt das Wort zwischen Artikel und Nomen? <i>das laute Handy</i> ✔ → Adjektiv. Adjektive sagen, <b>wie</b> etwas ist.",ex:"neu, laut, kalt, schnell"},
 D:{n:"Adverb",pl:"Adverbien",c:"#e07b00",l:"#fdeedd",h:"<b>Fragewort-Probe:</b> Wann? Wo? Wie oft? Warum? Adverbien bekommen <b>nie</b> eine Endung: <i>das dorte Haus</i> ✘",ex:"heute, dort, oft, deshalb"},
 R:{n:"Artikel",pl:"Artikel",c:"#5f6b7a",l:"#eceff3",h:"<b>Artikel</b> sind Begleiter des Nomens: <i>der, die, das, ein, eine</i> – auch gebeugt: <i>dem, den, des, einen …</i>",ex:"der, die, das, ein, dem"},
 P:{n:"Pronomen",pl:"Pronomen",c:"#7b4bb7",l:"#efe6fa",h:"<b>Pronomen</b> stehen für ein Nomen (<i>ich, du, er, sie, es, wir, uns</i>) oder zeigen, wem etwas gehört (<i>mein, sein, ihre, unsere</i>).",ex:"ich, wir, es, mein, ihre"},
 Z:{n:"Präposition",pl:"Präpositionen",c:"#0f8b8d",l:"#dff3f3",h:"<b>Präpositionen</b> zeigen, wie Dinge zueinander stehen – meist Ort oder Zeit: <i>in, auf, unter, mit, nach, wegen</i>.",ex:"auf, mit, nach, unter, wegen"},
 K:{n:"Konjunktion",pl:"Konjunktionen",c:"#c2185b",l:"#fbe3ec",h:"<b>Konjunktionen</b> verbinden Wörter oder Sätze: <i>und, oder, aber, weil, dass, wenn</i>.",ex:"und, aber, weil, dass, wenn"}
};
const ORDER = ["N","V","J","D","R","P","Z","K"];
const NOMINAL = ["Zocken","Lesen"];

const RAW = [
 "Der/R kleine/J Hund/N bellt/V heute/D laut/J",
 "Mia/N kauft/V ein/R neues/J Handy/N",
 "Gestern/D spielten/V wir/P Fußball/N auf/Z dem/R Platz/N",
 "Ben/N isst/V gern/D Pizza/N",
 "Meine/P Schwester/N hört/V oft/D laute/J Musik/N",
 "Das/R Wasser/N ist/V kalt/J",
 "Lea/N wohnt/V dort/D mit/Z ihrer/P Familie/N",
 "Tim/N und/K Paul/N fahren/V mit/Z dem/R Fahrrad/N",
 "Ich/P trinke/V morgens/D kalten/J Kakao/N",
 "Das/R Zocken/N macht/V Spaß/N",
 "Nach/Z dem/R Training/N sind/V die/R Spieler/N müde/J",
 "Wir/P bleiben/V heute/D drinnen,/D weil/K es/P regnet/V",
 "Oma/N backt/V einen/R leckeren/J Kuchen/N",
 "Der/R Lehrer/N erklärt/V uns/P die/R schwierige/J Aufgabe/N",
 "Jonas/N spielt/V Gitarre,/N aber/K er/P singt/V nie/D",
 "In/Z den/R Ferien/N fliegen/V wir/P nach/Z Spanien/N",
 "Die/R Katze/N schläft/V oben/D auf/Z dem/R Schrank/N",
 "Ich/P hoffe,/V dass/K du/P morgen/D kommst/V",
 "Das/R Lesen/N fällt/V meinem/P Bruder/N schwer/J",
 "Deshalb/D kauft/V Lea/N eine/R warme/J Jacke/N",
 "Mein/P Freund/N hat/V sein/P Handy/N verloren/V",
 "Wir/P können/V draußen/D Basketball/N spielen/V",
 "Der/R Film/N war/V spannend/J und/K lustig/J",
 "Wegen/Z des/R Regens/N spielen/V wir/P drinnen/D",
 "Paula/N schreibt/V ihrer/P Oma/N einen/R langen/J Brief/N",
 "Wenn/K die/R Sonne/N scheint,/V gehen/V wir/P schwimmen/V",
 "Der/R neue/J Schüler/N kommt/V aus/Z Italien/N",
 "Hier/D gibt/V es/P frische/J Brötchen/N",
 "Unsere/P Klasse/N gewinnt/V oft/D das/R Turnier/N",
 "Er/P läuft/V schnell/J nach/Z Hause/N",
 "Das/R Handy/N liegt/V unter/Z dem/R Bett/N",
 "Mein/P Bruder/N zockt/V abends/D mit/Z seinen/P Freunden/N",
 "Das/R Spiel/N ist/V schwer,/J aber/K wir/P gewinnen/V",
 "Lara/N trainiert/V hart/J für/Z das/R Turnier/N",
 "Der/R Gamer/N trinkt/V Wasser/N und/K isst/V einen/R Apfel/N"
];
const SENT = RAW.map(s => s.split(" ").map(x => { const i = x.lastIndexOf("/"); return { t:x.slice(0,i), k:x.slice(i+1) }; }));
const clean = t => t.replace(/[,.]$/,"");
const count = (s,k) => s.filter(w=>w.k===k).length;

const STAGES = {
 1:{title:"Qualifikation",short:"Nomen & Verben",steps:["N","V"],pre:[],pool:SENT.map((s,i)=>i),trophy:0,col:"#1f5fbf"},
 2:{title:"Halbfinale",short:"Adjektiv oder Adverb?",steps:["J","D"],pre:["N","V"],pool:SENT.map((s,i)=>i).filter(i=>count(SENT[i],"J")+count(SENT[i],"D")>0),trophy:1,col:"#2e9b45"},
 3:{title:"Finale",short:"Die kleinen Wörter: Artikel, Pronomen, Präposition, Konjunktion",steps:["R","P","Z","K"],pre:["N","V","J","D"],pool:SENT.map((s,i)=>i).filter(i=>["R","P","Z","K"].filter(k=>count(SENT[i],k)>0).length>=2),trophy:2,col:"#7b4bb7"}
};
const ROUNDS = 6;
const RANKS = ["Rookie","Bronze-Liga","Silber-Liga","Gold-Liga","Champion"];
const CAST_OK = ["Was für ein Treffer!","Clean! Sauber gespielt.","Pro-Move!","Der Chat rastet aus!","GG – das sitzt!","Voll ins Ziel!"];
const CAST_BAD = ["Knapp daneben – weiter geht's!","Kurzer Lag? Versuch's nochmal.","Respawn – nächster Versuch!","Nicht aufgeben, das Match läuft noch!"];

/* ---------- Zustand (nur im Arbeitsspeicher) ---------- */
const ST = { xp:0, trophies:[false,false,false,false], tag:"" };
const $ = s => document.querySelector(s);
const app = $("#app");
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const player = () => ST.tag ? esc(ST.tag) : "Player 1";
const ein = k => (k==="Z"||k==="K") ? "eine" : "ein";
const txtCol = k => k==="D" ? "#b35f00" : WA[k].c;

function updateHeader(){
  let r=0; ST.trophies.forEach((t,i)=>{ if(t) r=i+1; });
  $("#rankName").textContent = RANKS[r];
  $("#totalXp").textContent = ST.xp;
}
function addXp(n){ ST.xp += n; updateHeader(); }

/* Fehler-Statistik */
function newStats(){ return { conf:{}, cap:0, nom:0 }; }
function logConf(S, trueK, chosenK){ const key = trueK+">"+chosenK; S.conf[key]=(S.conf[key]||0)+1; }
function statsHTML(S, title){
  const items = [];
  if (S.cap) items.push([S.cap, `${S.cap}× ein Wort am <b>Satzanfang</b> für ein Nomen gehalten`, "Am Satzanfang schreibt man <b>jedes</b> Wort groß. Mach trotzdem die Artikelprobe!"]);
  if (S.nom) items.push([S.nom, `${S.nom}× ein <b>Verb als Nomen</b> (z. B. <i>das Zocken</i>) nicht erkannt`, "Steht ein Artikel vor dem Verb (<i>das Lesen</i>), ist es zum Nomen geworden – und wird großgeschrieben."]);
  Object.entries(S.conf).forEach(([k,n])=>{ const [t,c]=k.split(">"); items.push([n, `${n}× <b style="color:${txtCol(t)}">${WA[t].n}</b> als <b style="color:${txtCol(c)}">${WA[c].n}</b> bestimmt`, WA[t].h]); });
  items.sort((a,b)=>b[0]-a[0]);
  if (!items.length) return `<div class="stats"><h3>${title}</h3><div>Keine Verwechslungen – fehlerfrei! Stark gespielt, ${player()}.</div></div>`;
  return `<div class="stats"><h3>${title}</h3><ul>${items.slice(0,5).map(i=>`<li>${i[1]}</li>`).join("")}</ul><div class="tip"><b>Trainingstipp:</b> ${items[0][2]}</div></div>`;
}

/* ---------- Icons ---------- */
function cupSVG(i){
  const cols = ["#cd7f32","#b8c2cc","#ffd23f","#39d5ff"];
  return `<svg viewBox="0 0 60 60"><path d="M16 8h28v14c0 9-6 16-14 16S16 31 16 22z" fill="${cols[i]}"/><path d="M16 12H8c0 8 4 12 9 13M44 12h8c0 8-4 12-9 13" stroke="${cols[i]}" stroke-width="4" fill="none"/><rect x="26" y="37" width="8" height="9" fill="${cols[i]}"/><rect x="18" y="46" width="24" height="7" rx="2" fill="${cols[i]}"/><text x="30" y="28" text-anchor="middle" font-size="14" font-weight="900" fill="#fff" font-family="system-ui,sans-serif">${i+1}</text></svg>`;
}

/* ---------- Lobby ---------- */
function home(){
  const tn = ["Bronze","Silber","Gold","Champion"];
  app.innerHTML = `
  <section class="hero">
    <div class="card">
      <h2>Willkommen in der Liga!</h2>
      <p>Spiel dich durch das Turnier: Qualifikation, Halbfinale, Finale – und am Ende das <b>Grand Final</b>. Wer alle Wortarten erkennt, holt den Pokal!</p>
      <div class="tagrow"><input class="name" id="tag" maxlength="20" placeholder="Dein Gamertag (freiwillig)" value="${esc(ST.tag)}"><button class="btn ghost small" id="openCheat">Spickzettel</button></div>
    </div>
    <div class="trophies"><h3>Deine Pokale</h3><div class="tro">${tn.map((n,i)=>`<div class="${ST.trophies[i]?"on":""}">${cupSVG(i)}${n}</div>`).join("")}</div></div>
  </section>
  <section class="bracket">
    ${[1,2,3].map(l=>{ const g=STAGES[l]; return `<button class="mode" data-stage="${l}"><span class="step">${l}</span><div class="lv">Match · ${ROUNDS} Runden</div><h3>${g.title}</h3><p>${g.short}</p>
      <div class="dots">${g.steps.map(k=>`<i style="background:${WA[k].c}"></i>`).join("")}</div></button>`; }).join("")}
  </section>
  <section class="row2">
    <button class="mode speed" id="goSpeed"><div class="lv">Zeit-Challenge · 60 Sekunden</div><h3>Speedrun</h3><p>Welche Wortart ist markiert? Schaffe so viele wie möglich!</p></button>
    <button class="mode final" id="goFinal">${cupSVG(3).replace("<svg","<svg width=\"64\" height=\"64\" style=\"flex:none\"")}
      <div><div class="lv">Grand Final · ohne Hilfen</div><h3>Das Endspiel um den Pokal</h3><p>5 Runden: Bestimme jedes Wort im Satz selbst. Am Ende gibt es die Siegerurkunde.</p></div></button>
  </section>`;
  const t = $("#tag"); t.oninput = ()=>{ ST.tag = t.value.trim(); };
  app.querySelectorAll("[data-stage]").forEach(b=>b.onclick=()=>startStage(+b.dataset.stage));
  $("#goSpeed").onclick = startSpeed;
  $("#goFinal").onclick = startFinal;
  $("#openCheat").onclick = openCheat;
}
function openCheat(){
  $("#cheatTable").innerHTML = `<tr><th>Wortart</th><th>So erkennst du sie</th><th>Beispiele</th></tr>` +
    ORDER.map(k=>`<tr><td><span class="sw" style="background:${WA[k].c}"></span><b>${WA[k].n}</b></td><td>${WA[k].h}</td><td>${WA[k].ex}</td></tr>`).join("");
  $("#cheat").classList.add("show");
}
$("#cheatClose").onclick = ()=>$("#cheat").classList.remove("show");

/* ---------- Matches (Stufen) ---------- */
let G=null, C=null;
function startStage(n){
  const g = STAGES[n];
  let pool = shuffle(g.pool);
  if (n===1){ // mind. 1 Satz mit Verb als Nomen und 1 mit Adverb am Satzanfang
    const nom = pool.find(i=>SENT[i].some(w=>NOMINAL.includes(w.t)));
    const cap = pool.find(i=>SENT[i][0].k!=="N" && SENT[i][0].k!=="R" && SENT[i][0].k!=="P");
    const fix = [nom,cap].filter((x,i,a)=>x!==undefined && a.indexOf(x)===i);
    pool = shuffle(fix.concat(pool.filter(i=>!fix.includes(i)).slice(0,ROUNDS-fix.length)));
  }
  G = { n, g, cases:pool.slice(0,ROUNDS), idx:0, xp:0, perfect:0, combo:0, stats:newStats() };
  startRound();
}
function startRound(){
  const s = SENT[G.cases[G.idx]];
  C = { s, state:s.map(w=>G.g.pre.includes(w.k)?w.k:null), steps:G.g.steps.filter(k=>count(s,k)>0), si:-1, found:0, mist:0, rmist:0 };
  const pct = G.idx/ROUNDS*100;
  app.innerHTML = `
  <div class="topbar"><button class="btn dark small" id="back">← Lobby</button><span class="pill">${G.g.title}</span>
    <div class="progress"><i style="width:${pct}%"></i></div><span class="pill">Runde <b>${G.idx+1}</b>/${ROUNDS}</span>
    <span class="pill">XP <b id="mXp">${G.xp}</b></span><span class="pill combo" id="combo">Combo x${Math.max(1,Math.min(G.combo,5))}</span>
    <button class="btn ghost small" id="cheatBtn">Spickzettel</button></div>
  <div class="card">
    <div class="case-h"><span class="no">Runde ${G.idx+1}</span><h2>${G.g.title}: ${G.g.short}</h2></div>
    <div class="task" id="task"></div>
    <div class="sentence" id="sentence"></div>
    <div class="feedback" id="fb"></div>
    <div class="actions" id="acts"></div>
    <div class="legend">${ORDER.map(k=>`<span style="background:${WA[k].c}">${WA[k].n}</span>`).join("")}</div>
  </div>`;
  $("#back").onclick = home; $("#cheatBtn").onclick = openCheat;
  nextStep();
}
function draw(focusIdx){
  $("#sentence").innerHTML = C.s.map((w,i)=>{
    const k = C.state[i];
    const st = k && k!=="X" ? `background:${WA[k].l};border-color:${WA[k].c};box-shadow:0 3px 0 ${WA[k].c}` : k==="X" ? "background:#f3f4f7;color:#8a93a3;border-color:#e0e4ea;box-shadow:none" : "";
    const lab = k && k!=="X" ? `<span class="lab" style="color:${txtCol(k)}">${WA[k].n}</span>` : `<span class="lab"></span>`;
    return `<div class="w ${focusIdx===i?"focus":""}" data-i="${i}"><button ${k?"disabled":""} style="${st}">${esc(w.t)}</button>${lab}</div>`;
  }).join("");
  $("#sentence").querySelectorAll(".w button").forEach(b=>b.onclick=()=>tap(+b.parentNode.dataset.i,b));
}
function fb(type,html){ const f=$("#fb"); f.className="feedback show "+type; f.innerHTML=html; }
function clearFb(){ const f=$("#fb"); if(f){ f.className="feedback"; f.innerHTML=""; } }
function setCombo(){ const c=$("#combo"); if(!c) return; c.textContent="Combo x"+Math.max(1,Math.min(G.combo,5)); c.classList.add("pop"); setTimeout(()=>c.classList.remove("pop"),180); }
function nextStep(){
  C.si++; C.found=0; C.mist=0;
  const S = C.steps[C.si];
  if (S===undefined){
    C.s.forEach((w,i)=>{ if(!C.state[i]) C.state[i]="X"; });
    draw(-1);
    $("#task").innerHTML = `Runde gewonnen!<small>${C.rmist===0?"Perfekte Runde – ohne Fehler!":"Geschafft! Weiter zur nächsten Runde."}</small>`;
    $("#acts").innerHTML = `<button class="btn" id="nextR">${G.idx+1<ROUNDS?"Nächste Runde →":"Zum Match-Ergebnis →"}</button>`;
    $("#nextR").onclick = roundDone;
    return;
  }
  setTask(); draw(-1);
}
function setTask(){
  const S = C.steps[C.si], tot = count(C.s,S);
  $("#task").innerHTML = `Finde alle ${WA[S].pl}<span class="cnt" style="background:${WA[S].c}">${C.found} / ${tot}</span><small>Tippe die Wörter an.</small>`;
}
function tap(i, btn){
  const S = C.steps[C.si]; if (!S) return;
  const w = C.s[i];
  if (w.k===S){
    C.state[i]=S; C.found++; G.combo++; const x = 5*Math.min(G.combo,5); G.xp+=x; addXp(x); $("#mXp").textContent=G.xp; setCombo();
    const done = C.found===count(C.s,S);
    fb("ok", `<span class="caster">Kommentator</span>${rnd(CAST_OK)} <b>${esc(clean(w.t))}</b> ist ${ein(S)} ${WA[S].n}. +${x} XP`);
    if (done){ setTask(); draw(-1); setTimeout(()=>{ clearFb(); nextStep(); }, 850); }
    else { setTask(); draw(-1); }
    return;
  }
  // Fehler
  G.combo=0; setCombo(); C.mist++; C.rmist++;
  let extra = "";
  if (S==="N" && i===0 && w.k!=="N"){ G.stats.cap++; extra = `<br><b>Achtung Satzanfang:</b> „${esc(clean(w.t))}“ ist nur groß, weil der Satz damit beginnt.`; }
  else if (S==="V" && NOMINAL.includes(clean(w.t))){ G.stats.nom++; extra = `<br><b>Achtung:</b> Vor „${esc(clean(w.t))}“ steht ein Artikel – das Verb ist hier zum <b>Nomen</b> geworden!`; }
  else logConf(G.stats, w.k, S);
  if (S==="D" && w.k==="J") extra = `<br><b>Nomen-Probe:</b> Passt „${esc(clean(w.t))}“ zwischen Artikel und Nomen? Dann ist es ein Adjektiv – auch wenn es beim Verb steht.`;
  if (S==="J" && w.k==="D") extra = `<br><b>Probe:</b> „das ${esc(clean(w.t).toLowerCase())}e …“ klingt falsch → das ist ein Adverb (keine Endung möglich).`;
  btn.classList.remove("shake"); void btn.offsetWidth; btn.classList.add("shake");
  fb("bad", `<span class="caster">Kommentator</span>${rnd(CAST_BAD)} „${esc(clean(w.t))}“ ist k${ein(S)} ${WA[S].n}.<br>${WA[S].h}${extra}`);
  if (C.mist>=2){ const t = C.s.findIndex((x,j)=>x.k===S && !C.state[j]); draw(t); }
}
function roundDone(){
  if (C.rmist===0) G.perfect++;
  G.idx++;
  if (G.idx<ROUNDS) return startRound();
  const stars = G.perfect>=ROUNDS-1?3:G.perfect>=3?2:1;
  ST.trophies[G.g.trophy]=true; updateHeader();
  const tn = ["Bronze","Silber","Gold"][G.g.trophy];
  app.innerHTML = `<div class="card center">
    <div class="stars">${"★".repeat(stars)}<span class="off">${"★".repeat(3-stars)}</span></div>
    <h2 style="margin:6px 0">${G.g.title} gewonnen, ${player()}!</h2>
    <div class="big-num">${G.xp} XP</div>
    <p style="color:var(--muted);font-size:16px;margin:0">${G.perfect} von ${ROUNDS} Runden ohne Fehler.</p>
    <div style="width:80px;margin:10px auto 0">${cupSVG(G.g.trophy)}</div><p style="margin:4px 0 0;font-size:17px">Neuer Pokal: <b>${tn}</b></p>
    ${statsHTML(G.stats,"Match-Analyse")}
    <div class="actions" style="justify-content:center">
      <button class="btn ghost" id="again">Rematch</button>
      ${G.n<3?`<button class="btn" id="nextS">Weiter: ${STAGES[G.n+1].title}</button>`:`<button class="btn" id="toFinal">Zum Grand Final</button>`}
      <button class="btn dark" id="toHome">Lobby</button></div></div>`;
  $("#again").onclick=()=>startStage(G.n); $("#toHome").onclick=home;
  if ($("#nextS")) $("#nextS").onclick=()=>startStage(G.n+1);
  if ($("#toFinal")) $("#toFinal").onclick=startFinal;
}

/* ---------- Speedrun ---------- */
let B=null;
function startSpeed(){
  const items=[]; SENT.forEach((s,si)=>s.forEach((w,wi)=>items.push([si,wi])));
  B = { items:shuffle(items), pos:0, score:0, wrong:0, time:60, timer:null, lock:false, stats:newStats(), streak:0 };
  app.innerHTML = `<div class="topbar"><button class="btn dark small" id="back">← Lobby</button><span class="pill">Speedrun</span>
    <span class="pill">Treffer: <b id="bScore">0</b></span><div class="progress"><i id="bBar" style="width:100%"></i></div><div class="timer" id="bTime">60</div></div>
    <div class="card"><div class="task">Welche Wortart ist das <span style="background:#d8f6ff;padding:0 6px;border-radius:4px">markierte</span> Wort?</div>
    <div class="blitz-sent" id="bSent"></div><div class="qgrid" id="bQ"></div><div class="feedback" id="fb"></div></div>`;
  $("#back").onclick=()=>{ clearInterval(B.timer); home(); };
  B.timer = setInterval(()=>{
    B.time--; const t=$("#bTime"); if(!t){ clearInterval(B.timer); return; }
    t.textContent=B.time; $("#bBar").style.width=(B.time/60*100)+"%";
    if (B.time<=10) t.classList.add("low");
    if (B.time<=0){ clearInterval(B.timer); speedEnd(); }
  },1000);
  speedNext();
}
function speedNext(){
  if (B.pos>=B.items.length) B.pos=0;
  const [si,wi]=B.items[B.pos++]; const s=SENT[si], w=s[wi];
  $("#bSent").innerHTML = s.map((x,i)=>i===wi?`<mark>${esc(clean(x.t))}</mark>${esc(x.t.slice(clean(x.t).length))}`:esc(x.t)).join(" ")+".";
  const opts = shuffle([w.k].concat(shuffle(ORDER.filter(k=>k!==w.k)).slice(0,3)));
  $("#bQ").innerHTML = opts.map(k=>`<button data-k="${k}" style="background:${WA[k].c}">${WA[k].n}</button>`).join("");
  B.lock=false;
  $("#bQ").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    if (B.lock) return; B.lock=true;
    const ok = b.dataset.k===w.k;
    $("#bQ").querySelectorAll("button").forEach(x=>x.classList.add(x.dataset.k===w.k?"right":"wrong"));
    if (ok){ B.score++; B.streak++; addXp(2+Math.min(B.streak,5)); $("#bScore").textContent=B.score; fb("ok",`Treffer! <b>${esc(clean(w.t))}</b> → ${WA[w.k].n}${B.streak>=3?` · ${B.streak}er-Serie!`:""}`); }
    else {
      B.wrong++; B.streak=0;
      if (b.dataset.k==="N" && wi===0) B.stats.cap++; else if (w.k==="N" && NOMINAL.includes(clean(w.t))) B.stats.nom++; else logConf(B.stats,w.k,b.dataset.k);
      fb("bad",`„${esc(clean(w.t))}“ ist ${ein(w.k)} <b>${WA[w.k].n}</b>. ${WA[w.k].h}`);
    }
    setTimeout(()=>{ if (B.time>0){ clearFb(); speedNext(); } }, ok?550:2200);
  });
}
function speedEnd(){
  const sc=B.score;
  const msg = sc>=25?"Weltrekord-Verdacht! Absolute Profi-Leistung.":sc>=15?"Starker Run! Mit etwas Training knackst du die 25.":"Guter Start! Schau dir den Spickzettel an und starte einen neuen Run.";
  app.innerHTML = `<div class="card center"><h2>Zeit abgelaufen!</h2><div class="big-num">${sc}</div><p style="font-size:17px;margin:0">Treffer (${B.wrong} daneben)</p><p style="color:var(--muted)">${msg}</p>
    ${statsHTML(B.stats,"Run-Analyse")}
    <div class="actions" style="justify-content:center"><button class="btn" id="again">Neuer Run</button><button class="btn dark" id="toHome">Lobby</button></div></div>`;
  $("#again").onclick=startSpeed; $("#toHome").onclick=home;
}

/* ---------- Grand Final ---------- */
let F=null;
function startFinal(){
  const pool = shuffle(SENT.map((s,i)=>i).filter(i=>SENT[i].length>=5));
  // mind. 1 Satz mit Konjunktion und 1 mit Verb als Nomen
  const k = pool.find(i=>count(SENT[i],"K")>0);
  const n = SENT.findIndex(s=>s.some(w=>NOMINAL.includes(w.t)));
  const fix=[k,n].filter((x,i,a)=>x!==undefined && x>=0 && a.indexOf(x)===i);
  F = { cases:shuffle(fix.concat(pool.filter(i=>!fix.includes(i)).slice(0,5-fix.length))), idx:0, right:0, total:0, ans:null, checked:false, sel:-1, stats:newStats() };
  finalRound();
}
function finalRound(){
  const s=SENT[F.cases[F.idx]]; F.ans=s.map(()=>null); F.checked=false;
  app.innerHTML = `<div class="topbar"><button class="btn dark small" id="back">← Lobby</button><span class="pill">Grand Final · ohne Hilfen</span>
    <div class="progress"><i style="width:${F.idx/F.cases.length*100}%"></i></div><span class="pill">Runde <b>${F.idx+1}</b>/${F.cases.length}</span></div>
    <div class="card"><div class="case-h"><span class="no" style="background:#8a5a00">Grand Final ${F.idx+1}</span><h2>Bestimme jedes Wort</h2></div>
    <div class="task">Tippe jedes Wort an und wähle die Wortart.<small>Erst wenn alle Wörter bestimmt sind, kannst du die Runde abschließen.</small></div>
    <div class="sentence" id="sentence"></div><div class="feedback" id="fb"></div>
    <div class="actions"><button class="btn" id="check">Runde abschließen</button></div></div>`;
  $("#back").onclick=home; $("#check").onclick=finalCheck; finalDraw();
}
function finalDraw(){
  const s=SENT[F.cases[F.idx]];
  $("#sentence").innerHTML = s.map((w,i)=>{
    const k=F.ans[i];
    let st = k?`background:${WA[k].l};border-color:${WA[k].c};box-shadow:0 3px 0 ${WA[k].c}`:"";
    let lab = k?`<span class="lab" style="color:${txtCol(k)}">${WA[k].n}</span>`:`<span class="lab">?</span>`;
    if (F.checked){
      const ok=k===w.k;
      st=`background:${WA[w.k].l};border-color:${WA[w.k].c};box-shadow:0 3px 0 ${WA[w.k].c}`;
      lab = ok?`<span class="lab" style="color:#2e9b45">✔ ${WA[w.k].n}</span>`:`<span class="lab" style="color:#d62828">✘ ${WA[w.k].n}</span>`;
    }
    return `<div class="w" data-i="${i}"><button ${F.checked?"disabled":""} style="${st}">${esc(w.t)}</button>${lab}</div>`;
  }).join("");
  if (!F.checked) $("#sentence").querySelectorAll(".w button").forEach(b=>b.onclick=()=>openPalette(+b.parentNode.dataset.i));
}
function openPalette(i){
  F.sel=i; $("#sheetTitle").textContent=`„${clean(SENT[F.cases[F.idx]][i].t)}“ ist …`;
  $("#palette").innerHTML = ORDER.map(k=>`<button data-k="${k}" style="background:${WA[k].c}">${WA[k].n}</button>`).join("");
  $("#palette").querySelectorAll("button").forEach(b=>b.onclick=()=>{ F.ans[F.sel]=b.dataset.k; $("#sheet").classList.remove("show"); clearFb(); finalDraw(); });
  $("#sheet").classList.add("show");
}
$("#sheetClose").onclick=()=>$("#sheet").classList.remove("show");
$("#sheet").onclick=e=>{ if(e.target.id==="sheet") $("#sheet").classList.remove("show"); };
function finalCheck(){
  const s=SENT[F.cases[F.idx]];
  if (!F.checked){
    if (F.ans.some(a=>!a)) return fb("info","Bestimme zuerst <b>alle</b> Wörter – auch die, bei denen du unsicher bist.");
    F.checked=true; let r=0;
    s.forEach((w,i)=>{ const a=F.ans[i]; if(a===w.k) r++; else if (a==="N" && i===0) F.stats.cap++; else if (w.k==="N" && NOMINAL.includes(clean(w.t))) F.stats.nom++; else logConf(F.stats,w.k,a); });
    F.right+=r; F.total+=s.length; finalDraw();
    fb(r===s.length?"ok":"info", r===s.length?`Perfekte Runde! ${r} von ${s.length} Wörtern richtig.`:`${r} von ${s.length} Wörtern richtig. Schau dir die Korrekturen an.`);
    $("#check").textContent = F.idx+1<F.cases.length?"Nächste Runde →":"Zum Endergebnis →";
  } else { F.idx++; if (F.idx<F.cases.length) finalRound(); else finalEnd(); }
}
function finalEnd(){
  const pct=Math.round(F.right/F.total*100); addXp(F.right*3);
  let rank="Bronze-Liga", msg="Trainiere noch ein paar Matches – dann holst du den Pokal!";
  if (pct>=85){ rank="Champion"; msg="Unglaublich! Du bist der Champion der Wortarten-Liga."; ST.trophies[3]=true; }
  else if (pct>=70){ rank="Gold-Liga"; msg="Sehr stark! Nur noch ein paar Kleinigkeiten bis zum Champion."; }
  else if (pct>=50){ rank="Silber-Liga"; msg="Gute Leistung! Mit etwas Training geht noch mehr."; }
  updateHeader();
  app.innerHTML = `<div class="card center"><h2>Grand Final beendet!</h2><div class="big-num">${pct} %</div>
    <p style="font-size:17px;margin:0">${F.right} von ${F.total} Wörtern richtig bestimmt.</p><p style="color:var(--muted)">${msg}</p>
    ${statsHTML(F.stats,"Analyse für dein Training")}
    <div class="actions" style="justify-content:center;margin-top:14px"><input class="name" id="nm" maxlength="20" placeholder="Name für die Urkunde" value="${esc(ST.tag)}"><button class="btn" id="mk">Siegerurkunde erstellen</button></div>
    <div id="certBox"></div>
    <div class="actions" style="justify-content:center"><button class="btn ghost" id="again">Grand Final wiederholen</button><button class="btn dark" id="toHome">Lobby</button></div></div>`;
  $("#again").onclick=startFinal; $("#toHome").onclick=home;
  $("#mk").onclick=()=>{
    const n=$("#nm").value.trim()||"Player 1"; const d=new Date().toLocaleDateString("de-DE");
    $("#certBox").innerHTML = `<div class="cert" style="margin-top:14px">
      <div style="font-weight:800;letter-spacing:2px;color:#8a6a00">WORTARTEN-LIGA</div><h2>SIEGERURKUNDE</h2>
      <div>Im Grand Final hat</div><div class="nm">${esc(n)}</div>
      <div><b>${F.right} von ${F.total}</b> Wörtern (<b>${pct} %</b>) richtig bestimmt.</div>
      <div style="font-size:22px;font-weight:900;margin-top:10px;color:#251d52">Rang: ${rank}</div>
      <div style="width:84px;margin:8px auto 0">${cupSVG(pct>=85?3:pct>=70?2:pct>=50?1:0)}</div>
      <div style="font-size:14px;color:#5c6475">${d}</div></div>
      <p style="color:var(--muted);font-size:14px">Mach einen Screenshot von Urkunde und Analyse und zeig ihn deiner Lehrkraft!</p>`;
  };
}

updateHeader();
home();
</script>
</body>
</html>
